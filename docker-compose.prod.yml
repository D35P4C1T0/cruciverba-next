services:
  cruciverba:
    image: ${APP_IMAGE:-cruciverba:local}
    build: .
    container_name: ${CONTAINER_NAME:-cruciverba}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      FORCE_HTTPS: "True"
      TRUSTED_HOSTS: ${PUBLIC_HOSTNAME:?Imposta PUBLIC_HOSTNAME nel file .env},localhost,127.0.0.1
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
    volumes:
      - cruciverba_data:/app/data
    networks:
      - traefik

volumes:
  cruciverba_data:

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
