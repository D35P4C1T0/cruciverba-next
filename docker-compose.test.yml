services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
      - test_data:/app/data
    environment:
      - APP_ENV=testing
      - DEBUG=False
      - SECRET_KEY=test-secret-key-very-long-and-secure
      - FORM_PASSWORD=bianca
      - ADMIN_PASSWORD=bianca2024
      - CELEBRATED_PERSON_NAME=${CELEBRATED_PERSON_NAME:-Bianca}
      - DATABASE_PATH=data/test_cruciverba.db
    command: python -m pytest test_app.py -v --tb=short
    profiles:
      - test

  integration-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
    environment:
      - BASE_URL=http://cruciverba-app:5000
      - FORM_PASSWORD=bianca
      - ADMIN_PASSWORD=bianca2024
    depends_on:
      cruciverba-app:
        condition: service_healthy
    networks:
      - default
    command: python -m pytest test_integration.py -q
    profiles:
      - integration

  # Include the main app for integration tests
  cruciverba-app:
    build: .
    volumes:
      - test_data:/app/data
    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1
      - DEBUG=False
      - WTF_CSRF_ENABLED=False
      - RATELIMIT_ENABLED=False
      - SECRET_KEY=test-secret-key-at-least-thirty-two-characters
      - FORM_PASSWORD=bianca
      - ADMIN_PASSWORD=bianca2024
      - RATE_LIMIT_STORAGE_URL=memory://
      - FORCE_HTTPS=False
      - TRUSTED_HOSTS=localhost,127.0.0.1,cruciverba-app
    restart: "no"
    profiles:
      - integration

volumes:
  test_data:
    driver: local
