services:
  cruciverba:
    image: ${APP_IMAGE:-cruciverba:local}
    build: .
    container_name: ${CONTAINER_NAME:-cruciverba}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: development
      FORCE_HTTPS: "False"
      TRUSTED_PROXY_COUNT: "0"
      TRUSTED_HOSTS: localhost,127.0.0.1
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-5000}:5000"
    volumes:
      - cruciverba_data:/app/data

volumes:
  cruciverba_data:
